<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1b3a7a">
<meta name="description" content="받은편지함을 관련도와 긴급도로 자동 분류해, 중요한 메일만 남겨 드리는 메일 정리 데스크.">
<title>말끔 — 메일 정리 데스크</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231b3a7a'/%3E%3Cpath d='M8 11l8 6 8-6M8 11h16v11H8z' fill='none' stroke='%23fff' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/style.css?v=20261105-0924">
</head>
<body>
<div class="shell">
  <aside class="side" id="side">
    <a class="brand" href="#summary">말끔<span>.</span></a>

    <div class="ws-wrap">
      <button class="ws" id="ws" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="ws-menu">
        <span class="ws-mark" id="ws-mark">김</span>
        <span class="ws-text"><b id="ws-name">내 메일 데스크</b><small id="ws-sub">받은편지함 정리</small></span>
        <span class="ws-caret" aria-hidden="true">⌄</span>
      </button>
      <div class="ws-menu" id="ws-menu" role="menu" hidden></div>
    </div>

    <nav class="nav" aria-label="주 메뉴">
      <p class="nav-cap">WORKSPACE</p>
      <a href="#summary" data-route="summary">요약 대시보드</a>
      <a href="#inbox" data-route="inbox">분류함 <em id="nav-inbox"></em></a>
      <a href="#digest" data-route="digest">숨긴 메일 요약 <em id="nav-digest"></em></a>
      <p class="nav-cap">MANAGE</p>
      <a href="#profile" data-route="profile">업무 프로필</a>
      <a href="#connect" data-route="connect">메일 연동 설정</a>
    </nav>

    <div class="promo">
      <span class="promo-star" aria-hidden="true">✳</span>
      <p><b>메일은 가볍게,</b><br><b>업무에 더 집중하세요.</b></p>
      <small>받은편지함을 대신 정리해 드릴게요.</small>
      <a href="https://github.com/dhkdch1999/mail#readme" target="_blank" rel="noopener">말끔 사용 가이드 ↗</a>
    </div>

    <div class="me">
      <span class="avatar" id="me-avatar">김</span>
      <span class="me-text"><b id="me-name">김신입</b><small id="me-account">데모 계정</small></span>
      <a class="me-more" href="#profile" aria-label="프로필 설정">⋯</a>
    </div>
  </aside>

  <div class="scrim" id="scrim"></div>

  <main class="main">
    <header class="top">
      <button class="burger" id="burger" type="button" aria-label="메뉴 열기">☰</button>
      <p class="crumb"><span>/</span>워크스페이스<span>/</span><b id="crumb-here">요약 대시보드</b></p>
      <div class="top-right">
        <span class="chip" id="source-chip">데모 데이터</span>
        <span class="avatar sm" id="top-avatar">김</span>
      </div>
    </header>

    <div class="view" id="view" tabindex="-1"></div>

    <footer class="foot" id="foot">
      <span><b>말끔</b> · 받은편지함을 정리합니다.</span>
      <span id="foot-status">샘플 데이터 · 이 브라우저에 저장</span>
      <button type="button" id="foot-close" aria-label="안내 닫기">✕</button>
    </footer>
  </main>
</div>

<dialog class="modal" id="modal">
  <form method="dialog" class="modal-box" id="modal-box"></form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js?v=20261105-0924"></script>
</body>
</html>
